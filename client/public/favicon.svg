<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72">
  <!-- The same mark the app draws with BrandMark: theme ink tile, paper stroke, accent dot. -->
  <style>
    .tile { fill: #1a1816; }
    .stroke { stroke: #f5f2ed; }
    .dot { fill: #db6143; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f1ede5; }
      .stroke { stroke: #0f1012; }
      .dot { fill: #f87b5c; }
    }
  </style>
  <rect class="tile" x="18" y="18" width="72" height="72" rx="20" />
  <g class="stroke" transform="translate(54 54) scale(0.72) translate(-54 -54)" fill="none" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 27 V64 q0 9 9 9" />
    <path d="M39 73 q4 -9 8 0 t8 0 t8 0" />
    <circle class="dot" cx="76" cy="73" r="6.5" stroke="none" />
  </g>
</svg>
