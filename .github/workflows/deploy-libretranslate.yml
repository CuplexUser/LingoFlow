name: Deploy LibreTranslate to Cloud Run

# Rarely needed: only when the image changes (a new LibreTranslate version or more
# languages in deploy/libretranslate/Dockerfile).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation, no stored service-account keys

concurrency:
  group: deploy-libretranslate
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Private (IAM): only lingoflow-api's runtime service account, and anyone else given
      # roles/run.invoker, can call it. Scales to zero and is capped at one instance, so it
      # costs nothing while idle and can't run away. Cloud Run only marks a revision ready
      # once the port is open, which LibreTranslate does after loading its models, so a
      # successful deploy means the service started.
      - name: Deploy
        run: |
          gcloud run deploy libretranslate \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --source deploy/libretranslate \
            --no-allow-unauthenticated \
            --port 5000 \
            --min-instances 0 \
            --max-instances 1 \
            --cpu 2 \
            --memory 2Gi \
            --cpu-boost \
            --concurrency 8 \
            --timeout 120 \
            --execution-environment gen2
